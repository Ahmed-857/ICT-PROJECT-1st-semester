<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crustz n' Bites | Login</title>

    <link rel="stylesheet" href="login-page.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="authContainer">

        <!-- ================= FORM SIDE ================= -->

        <div class="authFormSection">

            <h1 class="restaurantLogo">
                Crustz n' Bites
            </h1>

            <p class="authDescription">
                Experience premium dining. Sign in to reserve tables,
                explore special offers, and enjoy exclusive benefits.
            </p>

            <!-- Radio Buttons -->

            <input type="radio" name="authTab" id="login" checked>
            <input type="radio" name="authTab" id="signup">

            <!-- Switch -->

            <div class="formSwitch">

                <label for="login">
                    Login
                </label>

                <label for="signup">
                    Signup
                </label>

            </div>

            <!-- ================= LOGIN FORM ================= -->

            <form id="loginForm">

                <input
                    class="formInput"
                    type="text"
                    placeholder="Username"
                    required>

                <div class="passwordContainer">

                    <input
                        class="formInput passwordInput"
                        type="password"
                        placeholder="Password"
                        required>

                    <button
                        type="button"
                        class="togglePassword">
                        👁
                    </button>

                </div>

                <button
                    type="submit"
                    class="submitButton">
                    Login
                </button>

            </form>

            <!-- ================= SIGNUP FORM ================= -->

            <form id="signupForm">

                <input
                    class="formInput"
                    type="text"
                    placeholder="Username"
                    required>

                <input
                    class="formInput"
                    type="email"
                    placeholder="Email Address"
                    required>

                <div class="passwordContainer">

                    <input
                        id="signupPassword"
                        class="formInput passwordInput"
                        type="password"
                        placeholder="Password"
                        required>

                    <button
                        type="button"
                        class="togglePassword">
                        👁
                    </button>

                </div>

                <div id="passwordStrength">
                    Password Strength
                </div>

                <button
                    type="submit"
                    class="submitButton">
                    Create Account
                </button>

            </form>

        </div>

        <!-- ================= IMAGE SIDE ================= -->

        <div class="authImageSection">

            <div class="imageOverlay">

                <h2>
                    Taste Luxury
                </h2>

                <p>
                    Premium international cuisine crafted
                    with passion and elegance.
                </p>

            </div>

        </div>

    </div>

    <script src="login-page.js"></script>

</body>
</html>
